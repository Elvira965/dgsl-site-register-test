name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create website update notification
        if: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
        env:
          SUPABASE_URL: https://mgxbsxqgjxpdvdjsixqi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          VERSION=$(grep -oE 'Version [0-9]+\.[0-9]+\.[0-9]+' index.html | head -1 | sed 's/^Version //')
          if [ -z "$VERSION" ]; then
            echo "Could not determine website version from index.html"
            exit 1
          fi
          echo "Creating TEST website update notification for version $VERSION"
          curl --fail-with-body -X POST "$SUPABASE_URL/rest/v1/site_notifications_test" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=ignore-duplicates,return=minimal" \
            --data "{\"version\":\"$VERSION\",\"title\":\"Website updated\",\"message\":\"A new version of the DGSL Site Register is available. Please refresh the website to load the latest version.\"}"

      - name: Notification setup reminder
        if: ${{ secrets.SUPABASE_SECRET_KEY == '' }}
        run: echo "SUPABASE_SECRET_KEY is not configured yet, so no update notification was created."
