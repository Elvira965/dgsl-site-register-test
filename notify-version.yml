name: Create TEST version notification

on:
  push:
    branches:
      - main
    paths:
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get website version
        id: version
        run: |
          VERSION=$(grep -oE "const SITE_VERSION = '[0-9]+\\.[0-9]+\\.[0-9]+'" app.js | head -1 | sed -E "s/.*'([0-9]+\\.[0-9]+\\.[0-9]+)'.*/\\1/")
          if [ -z "$VERSION" ]; then
            echo "Could not find SITE_VERSION in app.js"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether website version changed
        id: version_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff HEAD^ HEAD -- app.js | grep -qE "^[+-]const SITE_VERSION = '[0-9]+\\.[0-9]+\\.[0-9]+'"; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create TEST notification
        if: steps.version_check.outputs.version_changed == 'true'
        env:
          SUPABASE_URL: https://mgxbsxqgjxpdvdjsixqi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl --fail-with-body \
            -X POST \
            "$SUPABASE_URL/rest/v1/site_notifications_test" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=ignore-duplicates,return=minimal" \
            --data "$(jq -n \
              --arg version "$VERSION" \
              --arg title "Website updated" \
              --arg message "A new version of the DGSL Site Register is available. Please refresh the website to load the latest version." \
              '{version:$version,title:$title,message:$message}')"
